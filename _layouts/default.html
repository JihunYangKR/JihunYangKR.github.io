<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if page.title %}
            {{ page.title }} — {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>


    <meta
        name="description"
        content="{{ page.description | default: site.description | escape }}"
    >

    <meta
        name="author"
        content="{{ site.author.name | escape }}"
    >


    <link
        rel="canonical"
        href="{{ page.url | absolute_url }}"
    >


    <!-- Open Graph -->

    <meta
        property="og:title"
        content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}"
    >

    <meta
        property="og:description"
        content="{{ page.description | default: site.description | escape }}"
    >

    <meta
        property="og:type"
        content="{% if page.date %}article{% else %}website{% endif %}"
    >

    <meta
        property="og:url"
        content="{{ page.url | absolute_url }}"
    >


    <link
        rel="stylesheet"
        href="{{ '/css/style.css' | relative_url }}"
    >

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="{{ '/' | relative_url }}"
            class="logo"
        >
            Jihun Yang
        </a>

        <nav>

            <a href="{{ '/' | relative_url }}">
                Home
            </a>

            <a href="{{ '/#about' | relative_url }}">
                About
            </a>

            <a href="{{ '/#projects' | relative_url }}">
                Projects
            </a>

            <a href="{{ '/archive/' | relative_url }}">
                Archive
            </a>

            <button
                id="theme-button"
                class="icon-button"
                onclick="toggleTheme()"
            >
                🌙
            </button>

        </nav>

    </div>

</header>


<main>

    {{ content }}

</main>


<footer>

    <div>
        © 2026 Jihun Yang
    </div>

    <div>

        <a href="{{ '/archive/' | relative_url }}">
            Back to Archive ↑
        </a>

    </div>

</footer>


<script src="{{ '/js/main.js' | relative_url }}"></script>

</body>

</html>
