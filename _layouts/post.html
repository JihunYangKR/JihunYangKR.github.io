---
layout: default
---

<article>

    <section class="hero">

        <div class="container">

            <p class="eyebrow">
                ARCHIVE / NOTES
            </p>

            <h1>
                {{ page.title }}
            </h1>

            <p class="hero-description">
                {{ page.date | date: "%Y-%m-%d" }}
            </p>

        </div>

    </section>


    <section>

        <div class="container">

            <div class="archive-content">

                {{ content }}

            </div>

        </div>

    </section>

</article>
