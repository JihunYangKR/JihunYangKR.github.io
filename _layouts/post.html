<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ page.title }} — Jihun Yang
    </title>

    <link
        rel="stylesheet"
        href="{{ '/css/style.css' | relative_url }}"
    >

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="{{ '/' | relative_url }}"
            class="logo"
        >
            Jihun Yang
        </a>

        <nav>

            <a href="{{ '/' | relative_url }}">
                Home
            </a>

            <a href="{{ '/archive/' | relative_url }}">
                Archive
            </a>

            <button
                id="theme-button"
                class="icon-button"
                onclick="toggleTheme()"
            >
                🌙
            </button>

        </nav>

    </div>

</header>


<main>

<section class="hero">

    <div class="container">

        <p class="eyebrow">
            {{ page.categories | join: " / " | upcase }}
        </p>

        <h1>
            {{ page.title }}
        </h1>

        <p class="hero-description">
            {{ page.date | date: "%Y-%m-%d" }}
        </p>

    </div>

</section>


<section>

<div class="container">

    <article class="post-content">

        {{ content }}

    </article>


    {% if page.tags %}

    <div class="post-tags">

        {% for tag in page.tags %}

            <span class="tag">
                #{{ tag }}
            </span>

        {% endfor %}

    </div>

    {% endif %}

</div>

</section>

</main>


<footer>

    <div>
        © 2026 Jihun Yang
    </div>

    <div>

        <a href="{{ '/archive/notes/' | relative_url }}">
            ← Back to Notes
        </a>

    </div>

</footer>


<script src="{{ '/js/main.js' | relative_url }}"></script>

</body>

</html>
